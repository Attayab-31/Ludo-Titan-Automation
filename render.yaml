services:
  - type: web
    name: ludo-license-server
    env: python
    plan: free
    rootDir: license_server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: MASTER_LICENSE_KEY
        sync: false
      - key: PAUSED_MESSAGE
        sync: false
      - key: DISCLAIMER_VERSION
        value: "1"
      - key: DISCLAIMER_TEXT
        sync: false
      - key: PAYMENT_INSTRUCTIONS
        sync: false
      - key: PAYMENT_URL
        sync: false
