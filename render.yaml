services:
  - type: web
    name: ludo-license-server
    env: python
    plan: free
    rootDir: license_server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    disk:
      name: ludo-license-db
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: LICENSE_DB_PATH
        value: /var/data/licenses.db
      - key: ADMIN_SECRET
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: MASTER_LICENSE_KEY
        sync: false
      - key: PAUSED_MESSAGE
        sync: false
      - key: DISCLAIMER_VERSION
        value: "1"
      - key: DISCLAIMER_TEXT
        sync: false
      - key: PAYMENT_INSTRUCTIONS
        sync: false
      - key: PAYMENT_URL
        sync: false
