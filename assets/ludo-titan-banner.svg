<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Ludo Titan Automation</title>
  <desc id="description">A dark navy to green banner with a stylized Ludo board motif and the subtitle ADB-powered Ludo automation for LDPlayer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11131a"/>
      <stop offset="1" stop-color="#103d27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8de0a6"/>
      <stop offset="1" stop-color="#d2f5dc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <g opacity=".16" fill="none" stroke="#b7edc8" stroke-width="2">
    <path d="M640 0v360M760 0v360M880 0v360M1000 0v360M1120 0v360M600 60h600M600 180h600M600 300h600"/>
    <path d="M600 60h120v120H600zM840 180h120v120H840zM1080 60h120v120h-120z"/>
  </g>
  <g transform="translate(900 180)">
