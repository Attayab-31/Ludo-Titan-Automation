    <path d="M0-92 92 0 0 92-92 0Z" fill="#1b3428" stroke="#a8dfb8" stroke-opacity=".7" stroke-width="2"/>
    <path d="M0-92V0h92ZM92 0H0v92ZM0 92V0h-92ZM-92 0H0v-92Z" fill="#d5eadc" fill-opacity=".18"/>
    <circle cx="-45" cy="-45" r="16" fill="#e66c62"/>
    <circle cx="45" cy="-45" r="16" fill="#f1bf55"/>
    <circle cx="45" cy="45" r="16" fill="#68b7ed"/>
    <circle cx="-45" cy="45" r="16" fill="#8bd48f"/>
    <circle r="19" fill="url(#accent)"/>
    <path d="m-7 0 5 5 10-12" fill="none" stroke="#123322" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  </g>
  <text x="80" y="151" fill="#f2f7f3" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-.8">Ludo Titan</text>
  <text x="80" y="211" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="600">Automation</text>
  <path d="M82 241h74" stroke="#8de0a6" stroke-linecap="round" stroke-width="4"/>
  <text x="80" y="285" fill="#c7d6cd" font-family="Segoe UI, Arial, sans-serif" font-size="21">ADB-powered Ludo automation for LDPlayer</text>
</svg>
